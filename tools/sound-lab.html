<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sound Lab</title>
  <!-- 開発用：得票バーの「チリチリ」を聴き比べる（npm run dev で /tools/sound-lab.html）。本番のビルドには入らない -->
  <style>
    :root {
      --bg: #f3f1ec; --surface: #fbfaf7; --surface-2: #e9e6df; --ink: #1b2036; --muted: #6a6f82;
      --border: #d9d6cf; --accent: #23336e; --accent-ink: #f7f8ff; --red: #c8202c; --blue: #2c63d6; --navy: #1d2a5c;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #14182a; --surface: #1d2236; --surface-2: #262c44; --ink: #e8eaf3; --muted: #9aa0b8;
        --border: #333a55; --accent: #8fa4ff; --accent-ink: #10142a; --navy: #121a3d;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 system-ui, "Hiragino Sans", "Yu Gothic UI", sans-serif; }
    main { max-width: 1040px; margin: 0 auto; padding: 20px 16px 48px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .lead { color: var(--muted); margin: 0 0 16px; }
    .bar-row { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; padding: 12px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 16px; }
    .bar-row label { display: flex; align-items: center; gap: 8px; }
    .bar-row output { min-width: 4.5em; font-variant-numeric: tabular-nums; color: var(--muted); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .card h2 { font-size: 15px; margin: 0; }
    .card p { margin: 0; color: var(--muted); font-size: 12.5px; min-height: 2.6em; }
    .track { position: relative; height: 14px; border-radius: 4px; background: var(--navy); overflow: hidden; }
    .track i { position: absolute; left: 0; top: 0; bottom: 0; width: 30%; background: linear-gradient(90deg, #8e0f18, #d42a2a); }
    .btns { display: flex; gap: 6px; flex-wrap: wrap; }
    button { font: inherit; border: 1px solid var(--border); background: var(--surface-2); color: var(--ink); border-radius: 7px; padding: 6px 10px; cursor: pointer; }
    button.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .card.picked { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    section.custom { margin-top: 20px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
    section.custom h2 { font-size: 16px; margin: 0 0 10px; }
    .params { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px 20px; }
    .params label { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; font-size: 12.5px; }
    .params label input, .params label select { grid-column: 1 / -1; width: 100%; }
    .params output { font-variant-numeric: tabular-nums; color: var(--muted); }
    textarea { width: 100%; min-height: 76px; margin-top: 10px; font: 12px/1.45 ui-monospace, Consolas, monospace; background: var(--surface-2); color: var(--ink); border: 1px solid var(--border); border-radius: 7px; padding: 8px; }
    #flight .card { background: var(--surface-2); }
    .ref { margin-top: 20px; color: var(--muted); font-size: 12.5px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  </style>
</head>
<body>
  <main>
    <h1>Sound Lab：得票バーの「チリチリ」</h1>
    <p class="lead">押すと、そのバーが伸びる（▲）・縮む（▼）あいだの音を鳴らします。気に入った案は「調整」で下に読み込み、つまみで詰めて、出てきた値を伝えてください。</p>

    <div class="bar-row">
      <label>長さ <input id="dur" type="range" min="400" max="3000" step="100" value="1300"><output id="dur-out"></output></label>
      <label>音量 <input id="vol" type="range" min="0" max="100" step="5" value="80"><output id="vol-out"></output></label>
    </div>

    <div class="grid" id="presets"></div>

    <section class="custom">
      <h2>調整：<span id="custom-name">現在</span></h2>
      <div class="btns" style="margin-bottom:12px">
        <button class="primary" id="c-up" type="button">▲ 増える</button>
        <button class="primary" id="c-down" type="button">▼ 減る</button>
        <div class="track" style="flex:1;min-width:140px;align-self:center"><i id="c-fill"></i></div>
      </div>
      <div class="params" id="params"></div>
      <textarea id="json" readonly aria-label="いまの値"></textarea>
      <div class="btns" style="margin-top:6px"><button id="copy" type="button">値をコピー</button></div>
    </section>

    <section class="custom" id="flight">
      <h2>飛ぶ音：石の音 → 粒が飛ぶ音 → チリチリ（ゲームと同じ時刻で続けて鳴らす）</h2>
      <p class="lead" style="margin:0 0 10px">▲ は星を取ったとき（粒が盤で一瞬飛び散ってからバーへ。0.82秒から着く）、▼ は取られたとき（バーから盤へ）。チリチリはゲームの音（A）で鳴らします。</p>
      <div class="bar-row" style="margin-bottom:12px">
        <label>党の色
          <select id="f-tint"><option value="none">分けない</option><option value="red">赤（低め）</option><option value="blue">青（高め）</option></select>
        </label>
        <label>飛ぶ音の大きさ <input id="f-gain" type="range" min="0" max="200" step="10" value="100"><output id="f-gain-out"></output></label>
        <label><input id="f-stone" type="checkbox" checked> 石の音</label>
        <label><input id="f-ticks" type="checkbox" checked> チリチリ</label>
      </div>
      <div class="grid" id="flights"></div>
    </section>

    <div class="ref">音量の目安：
      <button id="r-stone" type="button">石を置く音</button>
      <button id="r-capture" type="button">石を取る音</button>
      <button id="r-end" type="button">終局の音</button>
    </div>
  </main>
  <script type="module" src="./sound-lab.ts"></script>
</body>
</html>
